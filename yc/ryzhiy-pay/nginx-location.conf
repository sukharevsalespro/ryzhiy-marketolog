# Вставить в /etc/nginx/snippets/ryzhiy-public-location.conf на BTC (ssh btc),
# зону — в /etc/nginx/conf.d/ryzhiy-public-zone.conf. <PAY_FUNCTION_ID> — id функции ryzhiy-pay.
# Порядок: бэкап обоих файлов → правка → nginx -t → systemctl reload nginx.
# Сервер-сервер: без CORS. Заголовок Sign nginx проксирует сам (не трогать).
#
# conf.d/ryzhiy-public-zone.conf:
#   limit_req_zone $binary_remote_addr zone=ryzhiy_pay_public:10m rate=30r/m;

location = /public/ryzhiy-pay {
    limit_except POST { deny all; }
    limit_req zone=ryzhiy_pay_public burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass https://functions.yandexcloud.net/<PAY_FUNCTION_ID>?;
    proxy_set_header Host functions.yandexcloud.net;
    include /etc/nginx/snippets/ryzhiy-upstream-secret.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_name functions.yandexcloud.net;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/crm-security.conf;
}
