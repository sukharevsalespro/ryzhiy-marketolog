<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- OG-карточки, облик B «графит, слово-эхо» (выбор владельца 22.10.2026; прежний «графит со стеклом» от 01.10 заменён).
     Язык первых экранов: вырез из новой съёмки на графите, рыжее свечение за фигурой, контурное слово-эхо над головой,
     постерный заголовок 2–4 слова, один акцент в рыжей плашке, рыжая кромка по краю (в тёмной ленте Telegram не сливается с фоном).
     Даты нетворкинга, мастер-группы и вебинара — из assets/data/events.json по правилу сайта «ближайшее = ещё не началось».
     Рендер: ?id=<страница>; готовность — body[data-ready]. Шрифты сайта не содержат ₽ — он рисуется DejaVu Sans. -->
<style>
@font-face{font-family:Golos;src:url(../../assets/fonts/golos-cyrillic.woff2) format('woff2');font-weight:400 900;unicode-range:U+0400-045F,U+2116}
@font-face{font-family:Golos;src:url(../../assets/fonts/golos-latin.woff2) format('woff2');font-weight:400 900;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Poster;src:url(../../assets/fonts/roboto-var-cyrillic.woff2) format('woff2');font-weight:100 900;font-stretch:75% 100%;unicode-range:U+0400-045F}
@font-face{font-family:Poster;src:url(../../assets/fonts/roboto-var-latin.woff2) format('woff2');font-weight:100 900;font-stretch:75% 100%;unicode-range:U+0000-00FF,U+2000-206F}
:root{--or:#fe6c1f;--ink:#111;--cream:#faf7f2;--mute:#cfc8be}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Golos,'DejaVu Sans',sans-serif;color:var(--cream);
  background:radial-gradient(42% 70% at var(--gx,78%) 52%,rgba(254,108,31,.62),rgba(254,108,31,.18) 55%,rgba(254,108,31,0) 100%),
             radial-gradient(30% 45% at 6% 100%,rgba(168,51,12,.30),rgba(168,51,12,0)),linear-gradient(180deg,#2b2d32,#202226)}
body::after{content:"";position:absolute;inset:0;z-index:9;border:6px solid var(--or);pointer-events:none}
.echo{position:absolute;right:36px;top:24px;z-index:0;display:flex;justify-content:flex-end;overflow:hidden;
  font:900 150px/.8 Poster,sans-serif;font-stretch:75%;text-transform:uppercase;letter-spacing:-.02em;
  color:transparent;-webkit-text-stroke:2px rgba(250,247,242,.3);white-space:nowrap}
.fig{position:absolute;z-index:1;display:block;max-width:none}
.txt{position:absolute;left:64px;top:56px;bottom:80px;z-index:3;display:flex;flex-direction:column;align-items:flex-start}
.k{font:700 22px/1.2 Golos,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin-top:18px;font:900 120px/.86 Poster,'DejaVu Sans',sans-serif;font-stretch:75%;text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap}
h1 em{font-style:normal;color:var(--or)}
.sub{margin-top:14px;font:600 22px/1.25 Golos,'DejaVu Sans',sans-serif}
.acc{margin-top:auto;background:var(--or);color:var(--ink);font:900 46px/1 Poster,'DejaVu Sans',sans-serif;font-stretch:75%;
  text-transform:uppercase;padding:12px 20px 10px;white-space:nowrap}
.r{font-family:'DejaVu Sans',sans-serif;font-weight:700;font-size:.8em;font-stretch:normal}
.dom{position:absolute;left:64px;bottom:32px;z-index:4;font:700 20px/1 Golos,sans-serif;opacity:.85}
</style></head><body>
<div class="echo" id="echo"></div><img class="fig" id="fig" alt="">
<div class="txt"><p class="k" id="k"></p><h1 id="h"></h1><p class="sub" id="sub"></p><p class="acc" id="acc"></p></div>
<p class="dom">рыжий-маркетолог.рф</p>
<script>
const R=' <span class="r">₽</span>';
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const msk=(s,o)=>new Date(s).toLocaleString('ru-RU',Object.assign({timeZone:'Europe/Moscow'},o));
const day=s=>msk(s,{day:'numeric'})+' '+MON[+new Date(s).toLocaleString('en-US',{month:'numeric',timeZone:'Europe/Moscow'})-1];
const rub=s=>s.replace(/\s*₽/,R).replace(/(\d) (\d{3})/g,'$1 $2');
// Кадры: вырезы новой съёмки (cut/og-suit-*.webp, x4 + BiRefNet + face-parsing) и дуэт вебинара.
// fh — высота выреза на карточке. Макушка всегда на y=118: голова заходит только на низ слова-эхо (приём первого экрана вебинара),
// низ фигуры уходит за край. Левый край фигуры — не левее x=752: колонке текста остаётся 660 px. fr — желаемый отступ справа.
const STAIRS='cut/og-suit-stairs-tongue.webp', WALL='cut/og-suit-wall-bag.webp';
// у каждой из 10 содержательных страниц свой кадр (возврат владельца 22.10: «не каждая повторяется, а одна и та же»);
// библиотека — cut/og-<имя>.webp из assets/img/<имя>-2400.webp, лица прошли QC 1:1 (qc.py), ступени с языком — только главная.
// 23.10: кадр OG — только фото, которое есть на самой странице: распаковка — N14 (блок внизу), развитие — N15 (обложка),
// позиционирование — L4 (блок с кнопкой), маркетинг доверия — L1 (билет); вырезы тем же рецептом (ogcut1023.py, исходники docs/neurophoto-2026-10-22)
const CUT=n=>'cut/og-'+n+'.webp';
const FULL={fh:520}, MID={fh:1000}, TOP=118, TEXT_W=660;
const C=ev=>{
 const next=t=>ev.filter(e=>e.type===t&&Date.parse(e.start)>Date.now()).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
 const nw=next('networking'), mg=next('mastergroup')[0], vu=ev.find(e=>e.id==='webinar-2026-10-29');
 return {
 'home':{img:STAIRS,...MID,fr:40,echo:'бренд',k:'Валентина Сухарева',h:'<em>Рыжий</em><br>маркетолог',sub:'Наставник по личному бренду',acc:'20+ лет в маркетинге'},
 'master-gruppa':{img:WALL,...FULL,fh:540,fr:90,echo:'группа',k:'Мастер-группа · до 5 человек',h:'Личный <em>бренд</em><br>за 4 недели',
   sub:'Онлайн · '+(mg?rub(mg.price):''),acc:mg?'Старт '+day(mg.start):''},
 'networking':{img:CUT('portrait-phone-call'),fh:900,fr:0,echo:'связи',k:'Онлайн-нетворкинг',h:'Полезные<br><em>знакомства</em>',
   sub:nw.length?nw[0].time+' · Контур.Толк':'',acc:nw.slice(0,2).map(e=>day(e.start)).join(' и ')},
 'vebinar-uznavaemost':{img:'../../assets/img/vu-duo-1600.webp',fh:512,fr:24,gx:'74%',echo:'стиль',k:'Практический вебинар',h:'Чтобы тебя<br><em>запоминали</em>',
   sub:(vu?rub(vu.price):'')+' · с Анной Шиндиной',acc:vu?day(vu.start)+' · '+msk(vu.start,{hour:'2-digit',minute:'2-digit'})+' МСК':''},
 'otzyvy':{img:CUT('otzyvy-n40-chair'),fh:660,fr:20,fx:24,echo:'отзывы',k:'Отзывы клиенток',h:'Своими<br><em>словами</em>',sub:'Оригинал под каждым отзывом',acc:'30 отзывов без правок'},
 'raspakovka':{img:CUT('raspakovka-game-host'),fh:660,fr:30,echo:'игра',k:'Игра «Путь гениальности»',h:'Распаковка<br><em>личности</em>',sub:'2–4 часа · лично 10 000'+R,acc:'5 000'+R+' в группе'},
 'razvitie':{img:CUT('rv-n15'),fh:740,fr:0,echo:'рост',k:'Наставник · 20+ лет в маркетинге',h:'Развитие<br>личного <em>бренда</em>',sub:'Консультация, мастер-группа, сопровождение',acc:'от 10 000'+R},
 'pozicionirovanie':{img:CUT('nf-silk-l4'),fh:900,fr:40,echo:'смысл',k:'Статья',h:'Своё<br><em>позиционирование</em>',sub:'Вопросы и пример из практики',acc:'Больше подписчиков и клиентов'},
 'zapis-lichnyj-brend':{img:CUT('portrait-mic'),fh:900,fr:40,echo:'запись',k:'Вебинар в записи',h:'Как развить<br>личный <em>бренд</em>',sub:'Доступ сразу после оплаты',acc:'800'+R},
 'marketing-doveriya':{img:CUT('nf-velvet-l1'),fh:700,fr:30,echo:'доверие',k:'Вебинар в записи',h:'Маркетинг<br><em>доверия</em>',sub:'Доступ после оплаты',acc:'888'+R},
 }};
(async()=>{
 const id=new URLSearchParams(location.search).get('id');
 const ev=(await (await fetch('../../assets/data/events.json',{cache:'no-store'})).json()).events, c=C(ev)[id];
 if(c.gx) document.body.style.setProperty('--gx',c.gx);
 fig.src=c.img; fig.style.height=c.fh+'px'; fig.style.top=TOP+'px';
 k.textContent=c.k; h.innerHTML=c.h; sub.innerHTML=c.sub; if(!c.sub) sub.remove(); acc.innerHTML=c.acc; if(!c.acc) acc.remove();
 echo.textContent=c.echo;
 await fig.decode(); await document.fonts.ready;
 const fw=fig.getBoundingClientRect().width; fig.style.right=(c.fx!=null?c.fx:Math.min(c.fr,1200-(64+TEXT_W+28)-fw))+'px';   // fx — точный отступ справа для широкой фигуры (локоть на подлокотнике), иначе формула выталкивает её за рамку
 const fl=fig.getBoundingClientRect().left;
 // заголовок и акцент не заходят на фигуру: кегль подгоняется под ширину до её левого края (минус 28 px)
 const maxW=Math.min(TEXT_W,fl-64-28); let fs=parseFloat(getComputedStyle(h).fontSize); while(h.scrollWidth>maxW&&fs>56){fs-=2;h.style.fontSize=fs+'px'}
 let as=46; while(acc.isConnected&&acc.getBoundingClientRect().right>fl-20&&as>28){as-=2;acc.style.fontSize=as+'px'}
 // слово-эхо — над фигурой, целиком (без среза посреди буквы)
 echo.style.left=(fl-30)+'px'; let ef=150; const ew=()=>{const g=document.createRange();g.selectNodeContents(echo);return g.getBoundingClientRect().width};
 while(ew()>echo.clientWidth&&ef>80){ef-=4;echo.style.fontSize=ef+'px'}   // ширину меряем по тексту: при flex-end лишнее уходит влево и scrollWidth его не видит
 document.body.dataset.fit=JSON.stringify({h:fs,acc:as,echo:ef,echoFits:ew()<=echo.clientWidth,hFits:h.scrollWidth<=maxW});
 document.body.dataset.ready=1;
})();
</script></body></html>
