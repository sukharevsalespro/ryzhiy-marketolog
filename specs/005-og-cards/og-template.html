<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Golos;src:url(../../assets/fonts/golos-cyrillic.woff2) format('woff2');font-weight:400 900;unicode-range:U+0400-045F,U+2116}
@font-face{font-family:Golos;src:url(../../assets/fonts/golos-latin.woff2) format('woff2');font-weight:400 900;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Poster;src:url(../../assets/fonts/roboto-var-cyrillic.woff2) format('woff2');font-weight:100 900;font-stretch:75% 100%;unicode-range:U+0400-045F}
@font-face{font-family:Poster;src:url(../../assets/fonts/roboto-var-latin.woff2) format('woff2');font-weight:100 900;font-stretch:75% 100%;unicode-range:U+0000-00FF,U+2000-206F}
/* Шрифты сайта не содержат ₽ — он рисуется DejaVu Sans (системный на NVR) */
:root{--orange:#FE6C1F;--ink:#111;--cream:#FAF7F2}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--orange);color:var(--ink);font-family:Golos,'DejaVu Sans',sans-serif;display:grid;grid-template-columns:470px 1fr}
.ph{height:630px;background-repeat:no-repeat;border-right:3px solid var(--ink)}
.tx{padding:50px 54px 40px 56px;display:flex;flex-direction:column;min-width:0}
.k{font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;line-height:1.25}
h1{font-family:Poster,'DejaVu Sans',sans-serif;font-stretch:75%;font-weight:900;text-transform:uppercase;letter-spacing:-.015em;line-height:1;margin-top:22px;text-wrap:balance}
.s{font-size:30px;line-height:1.22;font-weight:500;margin-top:22px;letter-spacing:-.01em}
.s b{font-weight:700}
.row{margin-top:auto;display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.pl{font-family:Poster,'DejaVu Sans',sans-serif;font-stretch:75%;font-weight:800;font-size:36px;line-height:1;padding:11px 16px 10px;text-transform:uppercase;background:var(--ink);color:var(--cream);white-space:nowrap}
.pl.c{background:var(--cream);color:var(--ink)}
.rub{font-family:'DejaVu Sans',sans-serif;font-weight:700;font-size:.82em;font-stretch:normal}
.f{margin-top:18px;padding-top:12px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;font-size:20px;font-weight:600}
</style></head>
<body><div class="ph" id="ph"></div><div class="tx">
<p class="k" id="k"></p><h1 id="h"></h1><p class="s" id="s"></p>
<div class="row" id="row"></div>
<div class="f"><span>Валентина Сухарева</span><span>рыжий-маркетолог.рф</span></div>
</div>
<script>
const R='<span class="rub">₽</span>';
// crop: [x, y, h] в пикселях исходника; ширина = h * 470/630
const C={
 'master-gruppa':{img:'mg-evening-m-1200.webp',sw:1200,crop:[260,0,1100],k:'Мастер-группа · до 5 человек',h:'Личный бренд<br>за 4 недели',hs:88,s:'Позиционирование, смыслы и контент без выгорания. Онлайн, по всей России.',pl:[['Старт 5 октября'],['12 500 '+R,'c']]},
 'otzyvy':{img:'portrait-newyear-1200.webp',sw:1200,crop:[330,0,1200],k:'Отзывы · 15 переписок',h:'Своими словами',hs:112,s:'Живые переписки с клиентками: мастермайнды, обучение, консультации. Без правок.',pl:[['Оригиналы переписок','c']]},
 'raspakovka':{img:'portrait-yalta-wall-smile-1200.webp',sw:1200,crop:[240,40,1300],k:'Игра «Путь гениальности» · 2–4 часа',h:'Распаковка личности',hs:108,s:'Найдём вашу уникальность и соберём позиционирование в одно предложение.',pl:[['В группе 5 000 '+R],['Лично 10 000 '+R,'c']]},
 'razvitie':{img:'event-selfie-1200.webp',sw:1200,crop:[250,540,1270],k:'Наставник · 20+ лет в маркетинге',h:'Развитие личного бренда',hs:92,s:'Смыслы, продукт, контент и путь клиента — вместе с наставником.',pl:[['Онлайн'],['от 10 000 '+R,'c']]},
 'zapis-lichnyj-brend':{img:'portrait-mic-1200.webp',sw:1200,crop:[0,120,1600],k:'Вебинар в записи',h:'Как развить<br>личный бренд',hs:88,s:'Позиционирование, маркетинг доверия и контент без выгорания.',pl:[['Доступ сразу'],['800 '+R,'c']]},
 'networking':{img:'portrait-phone-call-1200.webp',sw:1200,crop:[60,120,1500],k:'Онлайн-нетворкинг · 15–20 человек',h:'Полезные знакомства',hs:100,s:'<b>8 октября</b> — 10:00–12:00<br><b>10 ноября, 11 декабря</b> — 12:00–14:00 МСК',pl:[['Контур.Толк'],['от 990 '+R,'c']]},
};
const c=C[new URLSearchParams(location.search).get('id')];
const [x,y,h]=c.crop, sc=630/h, ph=document.getElementById('ph');
ph.style.backgroundImage=`url(../../assets/img/${c.img})`;
ph.style.backgroundSize=`${c.sw*sc}px auto`;
ph.style.backgroundPosition=`${-x*sc}px ${-y*sc}px`;
k.textContent=c.k; document.getElementById('h').innerHTML=c.h; document.getElementById('h').style.fontSize=c.hs+'px';
s.innerHTML=c.s;
row.innerHTML=c.pl.map(([t,m])=>`<span class="pl ${m||''}">${t}</span>`).join('');
</script></body></html>
